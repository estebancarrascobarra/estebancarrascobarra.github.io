<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esteban Ignacio Carrasco Barra | Física Teórica</title>
    <style>
        /* --- ESTILOS INTEGRADOS --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #111214; /* Tono oscuro basado en el fondo de la foto */
            color: #d1d5db;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Contenedor Principal Split-Screen */
        .card {
            display: flex;
            flex-direction: row;
            width: 100%;
            max-width: 950px;
            background: #1a1c1e; /* Gris carbón basado en el abrigo */
            border: 1px solid #2d3036;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            position: relative;
        }

        /* Sección de la Imagen (Mitad Izquierda) */
        .image-container {
            flex: 1;
            background-image: url('WhatsApp Image 2026-06-06 at 10.50.25.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100%;
        }

        /* Sección de Contenido (Mitad Derecha) */
        .content-container {
            flex: 1.2;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        /* Selector de Idioma Minimalista */
        .language-selector {
            position: absolute;
            top: 25px;
            right: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #9ca3af;
            z-index: 10;
        }

        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #374151; transition: .3s; border-radius: 18px; border: 1px solid #4b5563; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 2px; bottom: 2px; background-color: #9ca3af; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #4b5563; border-color: #6b7280; }
        input:checked + .slider:before { transform: translateX(16px); background-color: #f3f4f6; }

        /* Textos y Encabezados */
        h1 { 
            font-size: 1.8rem; 
            color: #f3f4f6; 
            margin-bottom: 12px; 
            line-height: 1.2;
        }
        
        .tagline { 
            font-size: 1rem; 
            color: #9ca3af; 
            margin-bottom: 20px; 
            line-height: 1.5;
        }

        /* Descripción Personal Optimizada */
        .bio {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #9ca3af;
            margin-bottom: 25px;
        }
        
        .academic-summary { 
            font-size: 0.85rem; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            margin-bottom: 20px; 
        }
        .academic-summary span { 
            background: #23262a; 
            padding: 8px 14px; 
            border-radius: 8px; 
            border: 1px solid #373b42; 
        }

        /* Focos de Investigación (Corregido espaciado y saltos de línea) */
        .research-tags { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 8px; 
            margin-bottom: 30px; 
        }
        .tag { 
            font-size: 0.75rem; 
            font-weight: 600; 
            color: #e5e7eb; 
            background: rgba(156, 163, 175, 0.15); 
            padding: 6px 12px; 
            border-radius: 20px; 
            border: 1px solid rgba(156, 163, 175, 0.3); 
            white-space: nowrap;
        }

        /* Botones: Alineación Estricta */
        .links-container { display: flex; flex-direction: column; gap: 12px; }
        
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.2s ease;
            color: #ffffff;
            border: 1px solid transparent;
            cursor: pointer;
            user-select: none;
        }

        .icon { display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; }
        .icon svg { width: 100%; height: 100%; }

        .btn:hover { filter: brightness(1.15); transform: translateY(-2px); }

        /* Colores Botones */
        .btn-email { background-color: #2ea043; }
        .btn-linkedin { background-color: #0a66c2; }
        .btn-whatsapp { background-color: #25d366; }
        .btn-instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .btn-cv { background-color: transparent; color: #d1d5db; border: 1px solid #4b5563; margin-top: 5px; }
        .btn-cv:hover { background-color: #374151; color: #ffffff; }

        /* --- VERSIÓN MÓVIL OPTIMIZADA --- */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .card {
                flex-direction: column;
                max-width: 100%;
                border-radius: 12px;
            }
            .image-container {
                width: 100%;
                height: 40vh; /* Proporción balanceada en móvil */
                background-position: center 20%;
            }
            .content-container {
                padding: 30px 20px;
            }
            h1 { font-size: 1.6rem; text-align: center; }
            .tagline { text-align: center; margin-bottom: 15px; }
            .bio { text-align: justify; font-size: 0.85rem; margin-bottom: 20px; }
            .research-tags { justify-content: center; }
            .language-selector { 
                top: 15px; 
                right: 15px; 
                background: rgba(26, 28, 30, 0.8); 
                padding: 6px 10px; 
                border-radius: 20px;
                border: 1px solid #2d3036;
            }
        }
    </style>
</head>

    <script>
        // Lógica de Idioma
        const toggle = document.getElementById('lang-toggle');
        const langLabel = document.getElementById('lang-label');
        const translatableElements = document.querySelectorAll('[data-es]');

        function updateLanguage(isEnglish) {
            translatableElements.forEach(el => {
                el.textContent = isEnglish ? el.getAttribute('data-en') : el.getAttribute('data-es');
            });
            langLabel.textContent = isEnglish ? 'ES' : 'EN';
        }

        toggle.addEventListener('change', (e) => {
            updateLanguage(e.target.checked);
        });

        // Inicializar en español
        updateLanguage(false);

        // Lógica de Copiado de Correo
        function copyEmail() {
            const email = "esteban.carrasco@ug.uchile.cl";
            navigator.clipboard.writeText(email).then(() => {
                const emailText = document.getElementById('email-text');
                const isEnglish = toggle.checked;
                emailText.textContent = isEnglish ? "Copied to clipboard!" : "¡Copiado al portapapeles!";
                
                setTimeout(() => {
                    emailText.textContent = email;
                }, 2000);
            });
        }
    </script>
