<!DOCTYPE html>

    <style>
        /* --- ESTILOS INTEGADOS (Cero dependencias externas) --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Contenedor Principal Ajustado */
        .card {
            width: 100%;
            max-width: 420px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
            text-align: center;
            position: relative;
        }

        /* Selector de Idioma Integrado en la Tarjeta */
        .language-selector {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #8b949e;
        }

        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #21262d; transition: .3s; border-radius: 18px; border: 1px solid #30363d; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 2px; bottom: 2px; background-color: #8b949e; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #1f6feb; border-color: #1f6feb; }
        input:checked + .slider:before { transform: translateX(16px); background-color: #ffffff; }

        /* Textos */
        h1 { font-size: 1.8rem; color: #f0f6fc; margin-bottom: 5px; }
        .tagline { font-size: 0.95rem; color: #8b949e; margin-bottom: 20px; }
        
        .academic-summary { font-size: 0.85rem; display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .academic-summary span { background: #21262d; padding: 6px 12px; border-radius: 6px; border: 1px solid #30363d; }

        /* Focos de Investigación */
        .research-tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 30px; }
        .tag { font-size: 0.75rem; font-weight: 600; color: #58a6ff; background: rgba(88,166,255,0.1); padding: 5px 12px; border-radius: 20px; border: 1px solid rgba(88,166,255,0.2); }

        /* Botones: Alineación Estricta */
        .links-container { display: flex; flex-direction: column; gap: 14px; }
        
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.2s ease;
            color: #ffffff;
            border: 1px solid transparent;
            cursor: pointer;
            user-select: none;
        }

        .icon { display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; }
        .icon svg { width: 100%; height: 100%; }

        .btn:hover { filter: brightness(1.15); transform: translateY(-2px); }

        /* Colores Botones */
        .btn-email { background-color: #2ea043; }
        .btn-linkedin { background-color: #0a66c2; }
        .btn-whatsapp { background-color: #25d366; }
        .btn-instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .btn-cv { background-color: transparent; color: #c9d1d9; border: 1px solid #8b949e; margin-top: 10px; }
        .btn-cv:hover { background-color: #30363d; color: #ffffff; }

    </style>
</head>

    <!-- Scripts -->
    <script>
        // Lógica de Idioma
        const toggle = document.getElementById('lang-toggle');
        const langLabel = document.getElementById('lang-label');
        const translatableElements = document.querySelectorAll('[data-es]');

        function updateLanguage(isEnglish) {
            translatableElements.forEach(el => {
                el.textContent = isEnglish ? el.getAttribute('data-en') : el.getAttribute('data-es');
            });
            langLabel.textContent = isEnglish ? 'ES' : 'EN';
        }

        toggle.addEventListener('change', (e) => {
            updateLanguage(e.target.checked);
        });

        updateLanguage(false);

        // Lógica de Copiado de Correo
        function copyEmail() {
            const email = "esteban.carrasco@ug.uchile.cl";
            navigator.clipboard.writeText(email).then(() => {
                const emailText = document.getElementById('email-text');
                const isEnglish = toggle.checked;
                emailText.textContent = isEnglish ? "Copied to clipboard!" : "¡Copiado al portapapeles!";
                
                // Restaura el texto original después de 2 segundos
                setTimeout(() => {
                    emailText.textContent = email;
                }, 2000);
            });
        }
    </script>
