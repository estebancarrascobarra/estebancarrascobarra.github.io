<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esteban Ignacio Carrasco Barra | Física Teórica</title>
    <style>
        /* --- ESTILOS INTEGRADOS --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #111214; 
            color: #d1d5db;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            display: flex;
            flex-direction: row;
            width: 100%;
            max-width: 950px;
            background: #1a1c1e; 
            border: 1px solid #2d3036;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden; 
        }

        .language-selector {
            position: absolute;
            top: 25px;
            right: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #9ca3af;
            z-index: 100;
        }

        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #374151; transition: .3s; border-radius: 18px; border: 1px solid #4b5563; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 2px; bottom: 2px; background-color: #9ca3af; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #4b5563; border-color: #6b7280; }
        input:checked + .slider:before { transform: translateX(16px); background-color: #f3f4f6; }

        .profile-sidebar {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111214;
        }

        .profile-pic {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 20%; 
            display: block;
        }

        .content-container {
            flex: 1.2;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 { font-size: 1.8rem; color: #f3f4f6; margin-bottom: 12px; line-height: 1.2; }
        .tagline { font-size: 1rem; color: #9ca3af; margin-bottom: 20px; line-height: 1.5; }
        .bio { font-size: 0.9rem; line-height: 1.6; color: #9ca3af; margin-bottom: 25px; }
        
        .academic-summary { font-size: 0.85rem; display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .academic-summary span { background: #23262a; padding: 8px 14px; border-radius: 8px; border: 1px solid #373b42; display: inline-block; width: fit-content; }

        .research-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 30px; }
        .tag { font-size: 0.75rem; font-weight: 600; color: #e5e7eb; background: rgba(156, 163, 175, 0.15); padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(156, 163, 175, 0.3); white-space: nowrap; }

        .links-container { display: flex; flex-direction: column; gap: 12px; }
        .btn { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 12px; font-size: 0.95rem; font-weight: 600; text-decoration: none; border-radius: 8px; transition: all 0.2s ease; color: #ffffff; border: 1px solid transparent; cursor: pointer; }
        .icon { display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; }
        .btn:hover { filter: brightness(1.15); transform: translateY(-2px); }

        .btn-email { background-color: #2ea043; }
        .btn-linkedin { background-color: #0a66c2; }
        .btn-whatsapp { background-color: #25d366; }
        .btn-instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .btn-cv { background-color: transparent; color: #d1d5db; border: 1px solid #4b5563; margin-top: 5px; }

        @media (max-width: 768px) {
            body { padding: 15px; }
            .card { flex-direction: column; border-radius: 12px; }
            .profile-sidebar { width: 100%; background: transparent; padding-top: 35px; margin-bottom: 10px; }
            .profile-pic {
                width: 160px;
                height: 160px;
                border-radius: 50%;
                border: 3px solid #2d3036;
                box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
                object-position: center 20%; 
            }
            .content-container { padding: 25px 20px 35px 20px; align-items: center; }
            h1 { text-align: center; }
            .tagline { text-align: center; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="language-selector">
            <span id="lang-label">EN</span>
            <label class="switch"><input type="checkbox" id="lang-toggle"><span class="slider"></span></label>
        </div>

        <div class="profile-sidebar">
            <img src="profile.jpg" alt="Esteban Carrasco" class="profile-pic" onerror="this.style.display='none';">
        </div>

        <div class="content-container">
            <header>
                <h1>Esteban Ignacio Carrasco Barra</h1>
                <p class="tagline">
                    <span data-es="Ingeniero Civil Matemático" data-en="Civil Mathematical Engineer"></span><br>
                    <span data-es="Estudiante de Magíster en Física" data-en="MSc in Physics Student"></span>
                </p>
                <p class="bio" data-es="Me apasiona resolver problemas complejos sin importar el área, pero encuentro mi mayor motivación en la Gravitación y la Cosmología." data-en="I am passionate about solving complex problems, but I find my core motivation in Gravitation and Cosmology."></p>
                <div class="academic-summary">
                    <span data-es="Beca Magíster Nacional ANID 2026" data-en="ANID National Master's Scholar 2026"></span>
                    <span data-es="Universidad de Chile FCFM" data-en="Universidad de Chile FCFM"></span>
                </div>
                <div class="research-tags">
                    <span class="tag" data-es="Relatividad General" data-en="General Relativity"></span>
                    <span class="tag" data-es="Cosmología Teórica" data-en="Theoretical Cosmology"></span>
                </div>
            </header>

            <main class="links-container">
                <div class="btn btn-email" onclick="copyEmail()"><span id="email-text">esteban.carrasco@ug.uchile.cl</span></div>
                <a href="https://www.linkedin.com/in/esteban-cb/" class="btn btn-linkedin">LinkedIn</a>
                <a href="cv.pdf" class="btn btn-cv" data-es="Descargar CV" data-en="Download CV"></a>
            </main>
        </div>
    </div>

    <script>
        const toggle = document.getElementById('lang-toggle');
        const translatableElements = document.querySelectorAll('[data-es]');
        toggle.addEventListener('change', (e) => {
            translatableElements.forEach(el => el.textContent = e.target.checked ? el.getAttribute('data-en') : el.getAttribute('data-es'));
            document.getElementById('lang-label').textContent = e.target.checked ? 'ES' : 'EN';
        });
        function copyEmail() {
            navigator.clipboard.writeText("esteban.carrasco@ug.uchile.cl");
            alert("Email copiado");
        }
    </script>
</body>
</html>
